<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DeepSearch · 发现值得探索的答案</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><a href="/" class="wordmark">DeepSearch<span class="dot">.</span></a><div class="topbar-actions"><span class="badge">个人搜索空间</span><div class="theme-picker" role="group" aria-label="主题">
      <button type="button" data-theme-choice="light" aria-label="浅色" aria-pressed="false" title="浅色"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg></button>
      <button type="button" data-theme-choice="dark" aria-label="深色" aria-pressed="false" title="深色"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5a8.5 8.5 0 1 0 9.7 9.7Z"/></svg></button>
      <button type="button" data-theme-choice="system" aria-label="跟随系统" aria-pressed="true" title="跟随系统"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg></button>
    </div></div></header>
  <main id="main">
    <section class="search-area" aria-label="搜索">
      <a class="logo" href="/" aria-label="DeepSearch 首页"><span>Deep</span>Search<span class="dot">.</span></a>
      <p class="tagline">从一个好问题，开始探索。</p>
      <form id="search-form" action="/search" method="get" role="search">
        <div class="search-box">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <label class="sr-only" for="query">搜索关键词</label>
          <input id="query" name="q" type="search" placeholder="搜索网页，发现更多可能" autocomplete="off" required>
          <button type="submit" aria-label="搜索">搜索 <span aria-hidden="true">↗</span></button>
        </div>
      </form>
      <p class="hint">让好奇心带路 <span>·</span> 支持 site: 站点搜索与精确短语</p>
    </section>
    <div class="results-layout">
    <section id="results-area" class="results-area" aria-label="搜索结果" hidden>
      <div class="results-tab">网页 <span>Web</span></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="results"></div>
      <nav id="pagination" aria-label="搜索结果分页" hidden></nav>
      <button id="retry" class="retry" type="button" hidden>重新搜索</button>
    </section>
    <aside id="related-images" aria-label="结果中的图片" hidden></aside>
    </div>
    <noscript><p>请启用 JavaScript 以加载搜索结果。</p></noscript>
  </main>
  <footer><span>少一点干扰，多一点发现。</span><span>网页搜索由 DeepSeek 提供</span></footer>
</body>
</html>
